<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>全屏图片</title>
  <style>
    /* 去掉所有默认边距，强制全屏 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden; /* 禁止滚动 */
    }

    /* 图片容器铺满窗口 */
    .fullscreen-image {
      width: 100%;
      height: 100%;
      object-fit: cover; /* 图片等比缩放裁剪，完全覆盖无变形 */
      display: block;
    }
  </style>
</head>
<body>
  <!-- 方法一：用 img 标签 -->
  <img class="fullscreen-image" src="permission.png" alt="全屏展示图">
  
  <!-- 方法二（备选）：用背景图，也可以换成下面这种写法 -->
  <!-- <div style="width:100%;height:100%;background:url('你的图片链接') center/cover no-repeat;"></div> -->
</body>
</html>
